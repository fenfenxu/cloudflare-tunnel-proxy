# Clash Verge Merge 片段示例（cf-tunnel-proxy）
# 重要：只写入「全局 Merge」或「当前 profile Merge」之一，禁止两端各贴一份（会重复代理名）。
# 改前带时间戳备份，并在聊天告知完整路径；重载后须经 API/unix socket 确认 proxies 含本节点。

# Clash Verge / Clash / mihomo Merge 片段示例（占位符，勿写真实密码/生产域）
# 使用前：先备份原 Merge/配置，例如
#   cp Merge.yaml "Merge.yaml.bak-cf-tunnel-$(date +%Y%m%d-%H%M%S)"
# 并在聊天告知用户备份路径。改完后请用户重载并选中节点。
#
# 将 <PORT> / USER / PASS / cf-tunnel-proxy.<domain> 换成实际值。
# Basic auth 的 USER 常见仍为 proxy（与 proxy.auth 一致）；主机名用 cf-tunnel-proxy。

proxies:
  - name: cf-tunnel-proxy
    type: http
    server: 127.0.0.1
    port: <PORT>
    username: USER
    password: PASS

# 按你现有配置把节点挂进 proxy-groups（示例）：
# proxy-groups:
#   - name: PROXY
#     type: select
#     proxies:
#       - cf-tunnel-proxy
#       - DIRECT

rules:
  # 进程直连，避免 Access WebSocket 套娃
  - PROCESS-NAME,cloudflared,DIRECT
  # 隧道 / Access 域名直连
  - DOMAIN,cf-tunnel-proxy.<domain>,DIRECT
  - DOMAIN-SUFFIX,cloudflareaccess.com,DIRECT
  - DOMAIN-SUFFIX,cfargotunnel.com,DIRECT

dns:
  fake-ip-filter:
    - cf-tunnel-proxy.<domain>
    - +.cloudflareaccess.com
    - +.cfargotunnel.com

tun:
  # 与 SKILL G 节一致：排除 CF IPv4 + IPv6，防止 utun/fdfe 劫持 access tcp
  route-exclude-address:
    # Cloudflare IPv4（常见）
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    # Cloudflare IPv6（至少含 2606:4700::/32）
    - 2606:4700::/32
    - 2803:f800::/32
    - 2400:cb00::/32
    - 2405:8100::/32
    - 2405:b500::/32
    - 2a06:98c0::/29
